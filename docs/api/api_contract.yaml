openapi: 3.1.0
info: {title: DiseaseGraph Lab API, version: 1.0.0}
servers: [{url: /api/v1}]
components:
  schemas:
    Project: {type: object, required: [project_id, name, status], properties: {project_id: {type: string, format: uuid}, name: {type: string}, disease_id: {type: string}, status: {type: string}}}
    ProjectCreate: {type: object, required: [slug, name, disease_id], properties: {slug: {type: string}, name: {type: string}, disease_id: {type: string, pattern: '^(MONDO|EFO):[0-9]+$'}, status: {type: string, enum: [active, test_only], default: active}}}
    StudyCreate: {type: object, required: [accession, title], properties: {accession: {type: string, minLength: 1, maxLength: 120}, title: {type: string, minLength: 1, maxLength: 500}, organism: {type: string, default: 'Homo sapiens'}, design_json: {type: object}}}
    Study: {type: object, required: [study_id, project_id, accession, title, organism, design_json, created_at], properties: {study_id: {type: string, format: uuid}, project_id: {type: string, format: uuid}, accession: {type: string}, title: {type: string}, organism: {type: string}, design_json: {type: object}, created_at: {type: string, format: date-time}}}
    DatasetRegistration: {type: object, required: [project_id, source], properties: {project_id: {type: string, format: uuid}, study_id: {type: [string, 'null'], format: uuid, description: Must identify a Study in the same project}, source: {type: string}, release: {type: string}, source_url: {type: string}, sha256: {type: string}, license_status: {type: string}, metadata_json: {type: object}}}
    AnalysisRun: {type: object, required: [analysis_run_id, run_type, status], properties: {analysis_run_id: {type: string, format: uuid}, run_type: {type: string}, status: {type: string}, created_at: {type: string, format: date-time}}}
    RunComparison: {type: object, required: [project_id, run_type, run_a, run_b, provenance_comparison, output_comparison], properties: {project_id: {type: string, format: uuid}, run_type: {type: string}, run_a: {type: object}, run_b: {type: object}, provenance_comparison: {type: object}, output_comparison: {type: object}}}
    JobStatus: {type: object, required: [job_id, analysis_run_id, project_id, state, created_at, description], properties: {job_id: {type: string, description: 'Currently identical to the synchronous AnalysisRun ID'}, analysis_run_id: {type: string}, project_id: {type: string, format: uuid}, state: {type: string}, progress: {type: [integer, 'null'], minimum: 0, maximum: 100}, created_at: {type: string, format: date-time}, description: {type: string}}}
    GraphNode: {type: object, required: [id, type, label, properties], properties: {id: {type: string}, type: {type: string}, label: {type: string}, properties: {type: object}}}
    GraphEdge: {type: object, required: [id, source, target, relation, evidence_ids], properties: {id: {type: string}, source: {type: string}, target: {type: string}, relation: {type: string}, evidence_ids: {type: array, items: {type: string}}}}
    Subgraph: {type: object, required: [project_id, nodes, edges, truncated, next_cursor], properties: {project_id: {type: string, format: uuid}, graph_build_id: {type: [string, 'null']}, analysis_run_id: {type: string}, nodes: {type: array, items: {$ref: '#/components/schemas/GraphNode'}}, edges: {type: array, items: {$ref: '#/components/schemas/GraphEdge'}}, truncated: {type: boolean}, next_cursor: {type: [string, 'null']}}}
    MechanismRoute: {type: object, required: [route_type, drug_id, target_gene_id, pathway_id, evidence_ids], properties: {route_type: {type: string, enum: [public_kg_pathway, s1_enrichment_overlap]}, candidate_id: {type: string}, drug_id: {type: string}, target_gene_id: {type: string}, pathway_id: {type: string}, pathway_label: {type: string}, disease_context_id: {type: string}, evidence_ids: {type: array, items: {type: string}}, analysis_assertions: {type: array, items: {type: object}}, context_assertions: {type: array, items: {type: object}}}}
    MechanismsResponse: {type: object, required: [project_id, pert_id, routes, interpretation], properties: {project_id: {type: string}, pert_id: {type: string}, routes: {type: array, items: {$ref: '#/components/schemas/MechanismRoute'}}, interpretation: {type: string}}}
    GraphBuild: {type: object, required: [graph_build_id, analysis_run_id, status, graph_source, input_hashes, summary], properties: {graph_build_id: {type: string}, analysis_run_id: {type: string}, status: {type: string, enum: [importing, materialized_snapshot, materialized, failed]}, graph_source: {type: string}, input_hashes: {type: object, additionalProperties: {type: string}}, summary: {type: object}}}
    EvidenceRecord: {type: object, required: [evidence_id, graph_build_id, source_release, source_record_id, subject_id, predicate, object_id, source_assertion, assertion_sha256], properties: {evidence_id: {type: string, pattern: '^[a-f0-9]{64}$'}, graph_build_id: {type: string}, source_release: {type: string}, source_record_id: {type: string}, subject_id: {type: string}, predicate: {type: string}, object_id: {type: string}, source_assertion: {type: object}, source_url: {type: [array, string, 'null']}, assertion_sha256: {type: string, pattern: '^[a-f0-9]{64}$'}}}
paths:
  /health: {get: {summary: Local service health, servers: [{url: /}]}}
  /projects: {get: {summary: List projects}, post: {summary: Create project with an explicit active or test_only status; omitted status defaults to active, requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ProjectCreate'}}}}}}
  /projects/{project_id}: {get: {summary: Get project}}
  /projects/{project_id}/studies: {get: {summary: List studies within one project, responses: {'200': {description: Project-scoped study metadata, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/Study'}}}}}}}, post: {summary: Create or idempotently retrieve a study by project and normalized accession; conflicting metadata returns 409, requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/StudyCreate'}}}}}}
  /projects/{project_id}/datasets/{dataset_id}/study: {patch: {summary: Link an existing dataset to a study in the same project; cross-project links return 422, parameters: [{name: project_id, in: path, required: true, schema: {type: string, format: uuid}}, {name: dataset_id, in: path, required: true, schema: {type: string, format: uuid}}], requestBody: {required: true, content: {application/json: {schema: {type: object, required: [study_id], properties: {study_id: {type: string, format: uuid}}}}}}}}
  /projects/{project_id}/runs: {get: {summary: List analysis runs}}
  /projects/{project_id}/runs/compare: {get: {summary: Compare two completed runs of the same type within one project; compare S2 only on exact condition_key and LINCS perturbagen pairs without pooling doses or times, parameters: [{name: run_a_id, in: query, required: true, schema: {type: string}}, {name: run_b_id, in: query, required: true, schema: {type: string}}], responses: {'200': {description: Provenance-aware run comparison, content: {application/json: {schema: {$ref: '#/components/schemas/RunComparison'}}}}, '404': {description: Run missing or outside the project}, '409': {description: Run not completed}, '422': {description: Incompatible run types or identical run IDs}}}}
  /projects/{project_id}/datasets: {get: {summary: List project datasets and their validation status}}
  /projects/{project_id}/s1/summary: {get: {summary: S1 summary}}
  /projects/{project_id}/s1/external-validation: {get: {summary: Return hash-verified Exp010 GSE139038 independent ER-positive cohort metrics and dose/time-stratified external LINCS ranking, parameters: [{name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 50}}, {name: offset, in: query, schema: {type: integer, minimum: 0, default: 0}}], responses: {'200': {description: External validation or an explicit unavailable state for projects without a registered external validation}, '404': {description: Project not found}, '503': {description: Manifest or output hash validation failed}}}}
  /projects/{project_id}/datasets/{dataset_id}/s1/precomputed: {post: {summary: Validate and register a project-scoped S1 run from an already computed DEG table, parameters: [{name: project_id, in: path, required: true, schema: {type: string}}, {name: dataset_id, in: path, required: true, schema: {type: string}}], requestBody: {required: true, content: {application/json: {schema: {type: object, required: [positive_group, negative_group], properties: {positive_group: {type: string, description: 'Group represented by positive logFC'}, negative_group: {type: string}, fdr_threshold: {type: number, exclusiveMinimum: 0, maximum: 1, default: 0.05}}}}}}}}
  /projects/{project_id}/datasets/{dataset_id}/s1/limma-microarray: {post: {summary: Run limma on a normalized log2 microarray with matched sample metadata, parameters: [{name: project_id, in: path, required: true, schema: {type: string}}, {name: dataset_id, in: path, required: true, schema: {type: string}}], requestBody: {required: true, content: {application/json: {schema: {type: object, required: [sample_metadata_dataset_id, positive_group, negative_group], properties: {sample_metadata_dataset_id: {type: string}, positive_group: {type: string}, negative_group: {type: string}, identifier_type: {type: string, enum: [symbol, entrez, ensembl], default: symbol}, fdr_threshold: {type: number, exclusiveMinimum: 0, maximum: 1, default: 0.05}, measurement_type: {type: string, enum: [normalized_log2_microarray]}}}}}}}}
  /projects/{project_id}/datasets/{dataset_id}/s1/rnaseq-edger-voom: {post: {summary: Run edgeR filterByExpr/TMM and limma-voom on raw integer counts, parameters: [{name: project_id, in: path, required: true, schema: {type: string}}, {name: dataset_id, in: path, required: true, schema: {type: string}}], requestBody: {required: true, content: {application/json: {schema: {type: object, required: [sample_metadata_dataset_id, positive_group, negative_group], properties: {sample_metadata_dataset_id: {type: string}, positive_group: {type: string}, negative_group: {type: string}, identifier_type: {type: string, enum: [symbol, entrez, ensembl], default: symbol}, fdr_threshold: {type: number, exclusiveMinimum: 0, maximum: 1, default: 0.05}, measurement_type: {type: string, enum: [raw_integer_counts]}}}}}}}}
  /projects/{project_id}/s1/genes: {get: {summary: Paginated genes from the immutable limma result, filtered by direction and FDR}}
  /projects/{project_id}/s1/volcano: {get: {summary: All tested limma genes for the S1 volcano plot; no recalculation}}
  /projects/{project_id}/s1/pathways: {get: {summary: Paginated S1 GO, Reactome, or Hallmark results from the latest S1-compatible enrichment or a specified AnalysisRun, parameters: [{name: collection, in: query, required: true, schema: {type: string, enum: [go_up, go_down, reactome_up, reactome_down, hallmark_gsea]}}, {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 20}}, {name: offset, in: query, schema: {type: integer, minimum: 0, default: 0}}, {name: significant_only, in: query, schema: {type: boolean, default: true}}, {name: analysis_run_id, in: query, schema: {type: string}}]}}
  /projects/{project_id}/s1/pathway-enrichment: {post: {summary: Run project-scoped GO BP and Reactome over-representation analysis and Hallmark preranked GSEA from a completed S1 AnalysisRun; retain a separate provenance-tracked AnalysisRun}}
  /projects/{project_id}/s2/candidates: {get: {summary: Paginated S2 candidates}}
  /projects/{project_id}/s2/import: {post: {summary: Import a completed project-scoped S2 LINCS run after validating its run manifest, S1 provenance and output hashes}}
  /projects/{project_id}/s2/run: {post: {summary: Run the project LINCS CLI from a completed project S1 run, retain the execution log, and import dose/time-stratified results; test_only projects must cap signatures}}
  /projects/{project_id}/s2/summary: {get: {summary: Summary of the latest completed project-scoped LINCS run}}
  /projects/{project_id}/s2/conditions: {get: {summary: Paginated versioned condition-level S2 results read from PostgreSQL when imported; dose and time strata are preserved}}
  /projects/{project_id}/s2/stability: {get: {summary: Descriptive Top-N recurrence across dose conditions, stratified by cell, perturbation type, and time; never combines WTCS into a drug efficacy rank, parameters: [{name: top_n, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 10}}]}}
  /projects/{project_id}/s2/evidence-matrix: {get: {summary: Paginated, source-hash-verified Exp006–Exp011 candidate evidence matrix}}
  /projects/{project_id}/s2/candidate-evidence: {get: {summary: Paginated Phase F candidate evidence joining Exp006–Exp011, project S2 dose rows, and evidence-ID-linked GraphBuild routes by exact LINCS pert_id; hash checked on read}}
  /projects/{project_id}/graph/summary: {get: {summary: Graph counts filtered by an optional project GraphBuild ID}}
  /projects/{project_id}/graph/search: {get: {summary: Search bounded project subgraph entities by label or stable ID, optionally filtered by GraphBuild ID}}
  /projects/{project_id}/graph/subgraph: {get: {summary: Bounded allow-listed subgraph query, optionally filtered by GraphBuild ID}}
  /projects/{project_id}/drugs/{drug_id}/mechanisms: {get: {summary: Public KG routes and project-specific intersections filtered by GraphBuild ID; responses retain evidence IDs and explicitly avoid efficacy claims, responses: {$ref: '#/components/schemas/MechanismsResponse'}}}
  /evidence/{evidence_id}: {get: {summary: Read a source assertion from the specified GraphBuild's PostgreSQL EvidenceRecord; legacy builds fall back to the audited graph source, parameters: [{name: evidence_id, in: path, required: true, schema: {type: string, pattern: '^[a-f0-9]{64}$'}}, {name: graph_build_id, in: query, required: false, schema: {type: string}}], responses: {'200': {description: Version-scoped source record, content: {application/json: {schema: {$ref: '#/components/schemas/EvidenceRecord'}}}}, '404': {description: Evidence or GraphBuild not found}}}}
  /datasets: {post: {summary: Register dataset into validation-pending state; optional study_id must belong to the same project, requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/DatasetRegistration'}}}}}}
  /projects/{project_id}/datasets/upload: {post: {summary: Stream a bounded UTF-8 CSV/TSV/TXT upload, hash and structurally validate it without starting analysis, parameters: [{name: filename, in: query, required: true, schema: {type: string}}, {name: dataset_type, in: query, required: true, schema: {type: string, enum: [expression_matrix, precomputed_deg, sample_metadata]}}, {name: study_id, in: query, required: false, schema: {type: string, format: uuid}, description: Must identify a Study in this project}], requestBody: {required: true, content: {application/octet-stream: {schema: {type: string, format: binary}}}}}}
  /jobs/{job_id}: {get: {summary: Read synchronous AnalysisRun status by job_id=analysis_run_id; no asynchronous progress is fabricated; 404 for unknown IDs, responses: {'200': {description: AnalysisRun state and timestamps, content: {application/json: {schema: {$ref: '#/components/schemas/JobStatus'}}}}, '404': {description: Unknown job or AnalysisRun ID}}}}
  /projects/{project_id}/graph-bundles: {post: {summary: Build a versioned project GraphBundle from completed linked S1, S2, and enrichment runs with provenance and mapping audits, parameters: [{name: project_id, in: path, required: true, schema: {type: string}}], requestBody: {required: true, content: {application/json: {schema: {type: object, required: [s1_analysis_run_id, s2_analysis_run_id, enrichment_analysis_run_id], properties: {s1_analysis_run_id: {type: string}, s2_analysis_run_id: {type: string}, enrichment_analysis_run_id: {type: string}}}}}}}}
  /projects/{project_id}/graph-builds: {get: {summary: List project graph versions}, post: {summary: Build or idempotently register a project graph from a validated project GraphBundle or the legacy audited Phase B bundle; GraphBuild ID is attached to imported relationships, parameters: [{name: project_id, in: path, required: true, schema: {type: string}}, {name: bundle_run_id, in: query, required: false, schema: {type: string}, description: Select a completed kg_graph_bundle AnalysisRun; defaults to the latest completed project bundle}]}}
x-security-rules:
  - "No endpoint accepts arbitrary Cypher."
  - "Subgraph responses enforce max_nodes, max_edges, max_depth, cursor pagination, and project/run filters."
  - "All endpoints require authentication before deployment beyond localhost."
